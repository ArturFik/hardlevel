<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Черный текст с видео в промежутках</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="video-bg">
      <video autoplay muted loop>
        <source src="video.mp4" type="video/mp4" />
      </video>
    </div>

    <div class="text-container">
      <h1>
        We're here <span class="video-gap"></span> to make
        <span class="video-gap"></span> healthy
        <span class="video-gap"></span> living effortless
        <span class="video-gap"></span> so you can
        <span class="video-gap"></span> live longer
        <span class="video-gap"></span> and happier
        <span class="video-gap"></span> life
      </h1>
    </div>
  </body>
</html>
